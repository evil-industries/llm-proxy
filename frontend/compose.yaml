# One runtime container. An existing Traefik terminates TLS and forwards to port
# 8317, preserving Host. Do not publish this backend port on a public interface.
services:
  cli-proxy-api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    command: ['./CLIProxyAPI', '--config', '/etc/gateway/config.yaml']
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8317}:8317'
    environment:
      TZ: UTC
      WRITABLE_PATH: /CLIProxyAPI
      CONSOLE_ENABLED: 'true'
      CONSOLE_STATIC_DIR: /CLIProxyAPI/console
      ORIGIN: ${ORIGIN:?Set the public HTTPS origin}
      AUTH_MODE: ${AUTH_MODE:-password}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_USERS: ${OIDC_ALLOWED_USERS:-}
    volumes:
      - ./deploy/data/config:/etc/gateway
      - gateway-auths:/var/lib/cliproxy/auths
      - gateway-logs:/CLIProxyAPI/logs
      - gateway-plugins:/CLIProxyAPI/plugins
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Match the existing private config mount's ownership policy.
    cap_add:
      - DAC_OVERRIDE
volumes:
  gateway-auths:
  gateway-logs:
  gateway-plugins:
