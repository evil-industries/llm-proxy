services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32 ::1/128}
    ports:
      - '${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - management
      - cli-proxy-api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official binary has this file capability, even when listening on 8080.
    cap_add:
      - NET_BIND_SERVICE

  management:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      BODY_SIZE_LIMIT: 'Infinity'
      # Caddy replaces the forwarded chain with one verified client address.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      ORIGIN: ${ORIGIN:?Run npm run deploy:setup -- https://your-gateway.example first}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Generate AUTH_PASSWORD_HASH first}
      PRIVATE_MANAGEMENT_URL: http://cli-proxy-api:8317
      PRIVATE_MANAGEMENT_KEY: ${PRIVATE_MANAGEMENT_KEY:?Generate the backend management key first}
    depends_on:
      - cli-proxy-api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cli-proxy-api:
    # Let the application use its 30-second shutdown grace before Docker forces exit.
    stop_grace_period: 35s
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: ['./CLIProxyAPI', '--config', '/etc/gateway/config.yaml']
    environment:
      TZ: UTC
      WRITABLE_PATH: /CLIProxyAPI
      MANAGEMENT_PASSWORD: ${PRIVATE_MANAGEMENT_KEY:?Generate the backend management key first}
    volumes:
      # Mount the directory so atomic configuration replacements persist.
      - ./deploy/data/config:/etc/gateway
      - gateway-auths:/var/lib/cliproxy/auths
      - gateway-logs:/CLIProxyAPI/logs
      - gateway-plugins:/CLIProxyAPI/plugins
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The private config bind mount is owned by the host's setup user.
    cap_add:
      - DAC_OVERRIDE

volumes:
  gateway-auths:
  gateway-logs:
  gateway-plugins:
