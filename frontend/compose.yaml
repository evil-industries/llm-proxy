services:
  management:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      BODY_SIZE_LIMIT: 'Infinity'
      # Trust only the host reverse proxy; this service is bound to loopback.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      ORIGIN: ${ORIGIN:?Set ORIGIN to the public HTTPS origin}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Generate AUTH_PASSWORD_HASH first}
      PRIVATE_MANAGEMENT_URL: ${PRIVATE_MANAGEMENT_URL:?Set the private backend URL}
      PRIVATE_MANAGEMENT_KEY: ${PRIVATE_MANAGEMENT_KEY:?Set the backend management key}
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - default
      - management-backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  management-backend:
    external: true
    name: ${MANAGEMENT_NETWORK:-management-backend}
