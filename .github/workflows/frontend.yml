name: Management frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run garden:check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:server
      - run: npm run deploy:test
      - name: Get the same Caddy binary used by Compose
        run: |
          docker run --rm --entrypoint /bin/cat caddy:2.11.4-alpine /usr/bin/caddy > "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
      - run: npm run test:proxy
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: frontend/test-results
          if-no-files-found: ignore
