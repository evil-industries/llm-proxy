name: Compose deployment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deployment.yml"
  push:
    paths:
      - "frontend/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deployment.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify the complete stack with a local provider fixture
        working-directory: frontend
        run: node scripts/smoke-compose.mjs
